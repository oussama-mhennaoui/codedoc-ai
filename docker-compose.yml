version: "3.9"

services:
  db:
    image: postgres:15
    container_name: codedoc-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-codedoc}
      POSTGRES_USER: ${POSTGRES_USER:-codedoc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-codedoc}
    ports:
      - "15432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codedoc"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.local
    container_name: codedoc-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/codedoc
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-codedoc}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-codedoc}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      JWT_SECRET: ${JWT_SECRET}
      SPRING_PROFILES_ACTIVE: dev
    ports:
      - "8081:8081"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: codedoc-frontend
    ports:
      - "4200:4200"
    environment:
      - NODE_ENV=development
      - CHROME_DRIVER_BIN=/usr/bin/chromium-browser
    depends_on:
      - backend

volumes:
  pgdata: