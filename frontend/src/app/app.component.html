<div class="app-layout" [class.authenticated]="authService.user() && !isLandingPage()">
  
  @if (authService.user() && !isLandingPage()) {
    <app-sidebar></app-sidebar>
  }

  <div class="main-wrapper">
    @if (authService.user() && !isLandingPage()) {
      <header class="top-bar">
        <div class="top-bar-left">
          <button mat-icon-button class="mobile-menu-btn" (click)="layoutService.toggleSidebar()">
            <mat-icon>menu</mat-icon>
          </button>
          
          <!-- Contextual Breadcrumbs could go here -->
          <div class="breadcrumbs" *ngIf="!layoutService.isHandset()">
            <span class="breadcrumb-item">Workspace</span>
            <mat-icon class="breadcrumb-separator">chevron_right</mat-icon>
            <span class="breadcrumb-item active">{{ title }}</span>
          </div>
        </div>

        <div class="top-bar-right">
          <button mat-icon-button matTooltip="Notifications">
            <mat-icon>notifications_none</mat-icon>
          </button>
          
          <button mat-icon-button matTooltip="Search (Ctrl+K)">
            <mat-icon>search</mat-icon>
          </button>
        </div>
      </header>
    }

    <main class="main-content">
      <router-outlet />
    </main>
  </div>
</div>
