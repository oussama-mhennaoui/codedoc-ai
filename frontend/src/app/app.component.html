<div 
  class="app-layout" 
  [class.authenticated]="authService.user() && !isFullBleedPage()"
  [class.sidebar-collapsed]="layoutService.isSidebarCollapsed()"
  [class.landing-mode]="isOnLandingPage()"
  [class.auth-mode]="isAuthPage()"
>
  @if (authService.user() && !isFullBleedPage()) {
    <app-sidebar></app-sidebar>
  }

  <div class="main-wrapper">
    @if (authService.user() && !isFullBleedPage()) {
      <header class="top-bar">
        <div class="top-bar-left">
          <button mat-icon-button class="mobile-menu-btn" (click)="layoutService.toggleSidebar()" matTooltip="Toggle Menu">
            <mat-icon>menu</mat-icon>
          </button>
          
          <div class="breadcrumbs" *ngIf="!layoutService.isHandset()">
            <span class="breadcrumb-item" routerLink="/dashboard" style="cursor: pointer;">Workspace</span>
            <mat-icon class="breadcrumb-separator">chevron_right</mat-icon>
            <span class="breadcrumb-item active">{{ pageTitle() }}</span>
          </div>
        </div>

        <div class="top-bar-right">
          <div class="status-indicator" matTooltip="AI Service Online & Validated">
            <span class="status-dot"></span>
            <span class="status-text">AI Ready</span>
          </div>

          <button mat-icon-button matTooltip="AI Test Generator" routerLink="/unit-test-generator">
            <mat-icon>science</mat-icon>
          </button>

          <button mat-icon-button matTooltip="Dashboard" routerLink="/dashboard">
            <mat-icon>dashboard</mat-icon>
          </button>
        </div>
      </header>
    }

    <main class="main-content">
      <router-outlet />
    </main>
  </div>
</div>
