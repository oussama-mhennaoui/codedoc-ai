<div class="auth-container">
  <mat-card>
    <mat-card-header>
      <div class="logo-container">
        <mat-icon class="logo-icon">description</mat-icon>
        <mat-card-title>CodeDoc AI</mat-card-title>
        <mat-card-subtitle>Sign in to your account to continue</mat-card-subtitle>
      </div>
    </mat-card-header>
    
    <mat-card-content>
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Username</mat-label>
          <input matInput formControlName="username" placeholder="Enter your username">
          <mat-icon matPrefix>person</mat-icon>
          <mat-error *ngIf="loginForm.controls.username.errors?.['required']">
            Username is required
          </mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Password</mat-label>
          <input matInput [type]="hidePassword ? 'password' : 'text'" formControlName="password" placeholder="Enter your password">
          <mat-icon matPrefix>lock</mat-icon>
          <button mat-icon-button matSuffix (click)="hidePassword = !hidePassword" type="button" tabindex="-1">
            <mat-icon>{{hidePassword ? 'visibility_off' : 'visibility'}}</mat-icon>
          </button>
          <mat-error *ngIf="loginForm.controls.password.errors?.['required']">
            Password is required
          </mat-error>
        </mat-form-field>

        <div class="actions">
          <button mat-flat-button color="primary" type="submit" [disabled]="loginForm.invalid || isLoading()">
            <mat-spinner *ngIf="isLoading()" diameter="20" color="accent" style="margin-right: 8px;"></mat-spinner>
            <mat-icon *ngIf="!isLoading()">login</mat-icon>
            <span>{{ isLoading() ? 'Signing in...' : 'Sign In' }}</span>
          </button>
        </div>
      </form>
    </mat-card-content>
    
    <div class="auth-footer">
      <p>New to CodeDoc AI? <a routerLink="/register">Create an account</a></p>
    </div>
  </mat-card>
</div>
