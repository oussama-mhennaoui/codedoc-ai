<div class="auth-container">
  <mat-card>
    <mat-card-header>
      <div class="logo-container">
        <mat-icon class="logo-icon">description</mat-icon>
        <mat-card-title>Code Docs</mat-card-title>
      </div>
      <mat-card-subtitle>Sign in to your account</mat-card-subtitle>
    </mat-card-header>
    <mat-card-content>
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Username</mat-label>
          <input matInput formControlName="username" placeholder="Enter your username">
          <mat-icon matPrefix>person</mat-icon>
          @if (loginForm.controls.username.errors?.['required']) {
            <mat-error>Username is required</mat-error>
          }
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Password</mat-label>
          <input matInput [type]="hidePassword ? 'password' : 'text'" formControlName="password" placeholder="Enter your password">
          <mat-icon matPrefix>lock</mat-icon>
          <button mat-icon-button matSuffix (click)="hidePassword = !hidePassword" [attr.aria-label]="'Hide password'" [attr.aria-pressed]="hidePassword" type="button">
            <mat-icon>{{hidePassword ? 'visibility_off' : 'visibility'}}</mat-icon>
          </button>
          @if (loginForm.controls.password.errors?.['required']) {
            <mat-error>Password is required</mat-error>
          }
        </mat-form-field>

        <div class="actions">
          <button mat-flat-button color="primary" type="submit" [disabled]="loginForm.invalid || isLoading()">
            @if (isLoading()) {
              <mat-icon><mat-spinner diameter="20"></mat-spinner></mat-icon>
            } @else {
              <mat-icon>login</mat-icon>
            }
            <span>{{ isLoading() ? 'Logging in...' : 'Login' }}</span>
          </button>
        </div>
      </form>
    </mat-card-content>
    <mat-card-footer class="auth-footer">
      <p>Don't have an account? <a routerLink="/register">Register here</a></p>
    </mat-card-footer>
  </mat-card>
</div>
