# SonarCloud Configuration for CodeDoc AI

# Project identification
sonar.projectKey=oussama-mhennaoui_codedoc-ai
sonar.organization=oussama-mhennaoui

# Project metadata
sonar.projectName=CodeDoc AI
sonar.projectVersion=1.0

# Source code location
sonar.sources=backend/src/main/java,frontend/src
sonar.tests=backend/src/test/java

# Java source and binary directories
sonar.java.source=17
sonar.java.binaries=backend/target/classes
sonar.java.test.binaries=backend/target/test-classes

# Coverage reports
sonar.coverage.jacoco.xmlReportPaths=backend/target/site/jacoco/jacoco.xml
sonar.java.coveragePlugin=jacoco

# Exclude generated and configuration files
sonar.exclusions=**/node_modules/**,**/target/**,**/*.spec.ts,**/dist/**,**/build/**,backend/src/main/resources/db/migration/**

# Test exclusions
sonar.test.exclusions=**/*Test.java,**/*IT.java

# Language-specific settings
sonar.java.libraries=backend/target/dependency/*.jar

# Code duplication
sonar.cpd.exclusions=**/dto/**,**/model/**,**/entity/**
